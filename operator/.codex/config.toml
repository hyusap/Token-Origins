# Dedicated Woga operator; start Codex from the operator directory.
model_instructions_file = "../AGENTS.md"
sandbox_mode = "read-only"
web_search = "live"

[features]
shell_tool = true
unified_exec = true
apps = false
multi_agent = false
multi_agent_v2 = false

[mcp_servers.woga]
command = "bun"
args = ["--no-env-file", "run", "mcp.ts"]
required = true
default_tools_approval_mode = "approve"
startup_timeout_sec = 45
tool_timeout_sec = 120

[mcp_servers.woga.env]
ORIGINS_BACKEND_URL = "http://127.0.0.1:4318"
